services:
  - type: web
    name: urunbul-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r apps/api/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir apps/api"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: ".:apps/api:packages"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///urunbul.db
